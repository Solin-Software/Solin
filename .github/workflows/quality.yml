name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.12"
  QT_QPA_PLATFORM: offscreen
  PYTHONFAULTHANDLER: "1"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      application_required: ${{ steps.classify.outputs.application_required }}
      release_preparation: ${{ steps.classify.outputs.release_preparation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install packaging==26.0
      - name: Detect documentation and version-only changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: python scripts/classify_quality_changes.py

  static:
    name: Static checks
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install ruff==0.15.16 packaging==26.0
      - run: python -m ruff check .
      - run: python scripts/check_locales.py
      - name: Validate release notes
        run: python scripts/release.py check-notes
      - name: Validate release preparation
        if: needs.changes.outputs.release_preparation == 'true'
        run: |
          python -m pip install pytest==9.0.3
          python -m pytest --noconftest tests/unit/test_release_metadata.py tests/unit/test_quality_changes.py
          python scripts/release.py metadata
          python - <<'PY'
          from scripts.release import current_version, load_notes
          load_notes(current_version())
          PY
      - name: Validate workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --proto '=https' \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=""

  platforms:
    name: Tests (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.application_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: Darwin
            qt_platform: cocoa
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        shell: bash
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update
          mapfile -t libobs_packages < <(bash scripts/build_solin.sh --print-native-packages)
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y \
            "${libobs_packages[@]}" \
            cmake \
            ffmpeg \
            libegl1 \
            libgl1 \
            libgtk-3-dev \
            libopengl0 \
            libpulse0 \
            libwebkit2gtk-4.1-dev \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            pkg-config \
            xauth \
            xvfb

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Build macOS pylibobs wheel
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install setuptools==80.10.2 wheel==0.46.3 cffi==2.0.0
          python scripts/build_pylibobs_macos.py --output-dir .pip-wheels

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          python -m pip install --no-index --find-links .pip-wheels --no-deps pylibobs
          python -m pip install -r requirements-dev.txt -e .

      - name: Install dependencies
        if: runner.os != 'macOS'
        run: python -m pip install -r requirements-dev.txt -e .

      - run: python scripts/typecheck.py --pythonplatform ${{ matrix.platform }}

      - name: Native protocol and benchmarks
        if: runner.os == 'Linux'
        run: |
          cmake -S native/media_engine -B build/native/media-engine-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native/media-engine-ci --config Release --parallel
          ctest --test-dir build/native/media-engine-ci -C Release --output-on-failure

      - name: Python suites on Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum python -m pytest tests/contract tests/integration tests/e2e --durations=20
          xvfb-run --auto-servernum python -m pytest tests/unit --durations=20

      - name: Python suites on Windows
        if: runner.os == 'Windows'
        run: |
          python -m pytest tests/contract --durations=20
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/integration --durations=20
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/unit --durations=20
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python suites on macOS
        if: runner.os == 'macOS'
        run: |
          # Intentional fatal diagnostics must retain reports without covering native UI tests.
          defaults write com.apple.CrashReporter DialogType -string server
          sudo sysctl -w kern.corefile="$RUNNER_TEMP/solin-core.%P"
          ulimit -c unlimited
          python -m pytest tests/integration/test_native_scene_content_pipeline.py -k 'closing_image or video_auto_switch' --log-cli-level=WARNING --durations=20

      - name: Report macOS native crashes
        if: failure() && runner.os == 'macOS'
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path
          reports = Path.home() / "Library/Logs/DiagnosticReports"
          destination = Path(os.environ["RUNNER_TEMP"]) / "solin-native-crashes"
          destination.mkdir(exist_ok=True)
          for report in sorted(reports.glob("*")):
              if report.suffix in {".ips", ".crash"} and "python" in report.name.lower():
                  shutil.copy2(report, destination / report.name)
                  print(f"::group::{report.name}", flush=True)
                  print(report.read_text(errors="replace"), flush=True)
                  print("::endgroup::", flush=True)
          for core in sorted(Path(os.environ["RUNNER_TEMP"]).glob("solin-core.*")):
              print(f"::group::Native core {core.name}", flush=True)
              try:
                  subprocess.run(
                      ["lldb", "--batch", "--core", str(core),
                       "--one-line", "thread backtrace all"],
                      timeout=60, check=False,
                  )
              except (OSError, subprocess.TimeoutExpired) as error:
                  print(f"::warning::Could not inspect native core {core.name}: {error}", flush=True)
              finally:
                  print("::endgroup::")
          PY

      - name: Preserve macOS native crash reports
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-crashes-${{ matrix.runner }}
          path: ${{ runner.temp }}/solin-native-crashes

      - name: Packaging source checks
        run: python -m pytest tests/contract/test_build_console_modes.py tests/contract/test_linux_appimage_packaging.py tests/contract/test_playlist_file_associations.py

  gate:
    name: Quality Gate
    if: always()
    needs: [changes, static, platforms]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          PLATFORM_RESULT: ${{ needs.platforms.result }}
          APPLICATION_REQUIRED: ${{ needs.changes.outputs.application_required }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$STATIC_RESULT" = success
          case "$APPLICATION_REQUIRED" in
            true) test "$PLATFORM_RESULT" = success ;;
            false) test "$PLATFORM_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
