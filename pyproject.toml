[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "solin"
dynamic = ["version"]
description = "Desktop control surface for media, meetings, projection, OBS, and Zoom."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ephem==4.2.1",
    "fonttools==4.62.1",
    "packaging==26.0",
    "pillow==12.1.1",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "PySide6==6.10.2",
    "pyqt-toast-notification==1.3.3",
    "pywinauto==0.6.9; sys_platform == 'win32'",
    "qrcode==8.2",
    "requests==2.32.5",
    "websocket-client==1.9.0",
]

[project.gui-scripts]
solin = "solin.bootstrap.application:run"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "solin.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solin = ["qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=.pytest-tmp -p no:cacheprovider"
tmp_path_retention_policy = "failed"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "build",
    "dist",
    "native_webview_widget",
    "translations",
]

[tool.ruff.lint]
# F: Pyflakes correctness, B: bugbear bug-prone patterns,
# S110: no silent try/except/pass blocks, BLE001: no unreviewed broad catches.
select = ["E9", "F", "B", "S110", "BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = [
    "src/solin/bootstrap",
    "src/solin/core/foundation",
    "src/solin/core/jw",
    "src/solin/core/meetings",
    "src/solin/core/playlists",
    "src/solin/core/timer",
]
exclude = [
    "**/__pycache__",
    ".pytest-tmp",
    "build",
    "dist",
    "native_webview_widget",
    "translations",
]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportPrivateUsage = false
