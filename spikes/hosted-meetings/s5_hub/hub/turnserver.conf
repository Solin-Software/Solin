# TURN relay for attendees that can't reach a hall/edge node directly.
# Secret, realm and external IP are passed on the command line (see docker-compose.yml).
listening-port=3478
min-port=50000
max-port=50999
use-auth-secret
fingerprint
no-tls
no-dtls
no-multicast-peers
# Spike limits; tune from S5 measurements.
total-quota=400
user-quota=12
stale-nonce=600
# Never relay to private/loopback ranges (SSRF protection), except what the spike needs locally.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
log-file=stdout
simple-log
