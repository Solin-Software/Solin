name: Build Solin Linux

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: true
      retention_days:
        type: number
        default: 5
  workflow_dispatch:
    inputs:
      retention_days:
        description: Artifact retention in days
        required: true
        type: number
        default: 5
      run_packaged_smoke_test:
        description: Run the packaged application under Xvfb
        required: true
        type: boolean
        default: true
      run_release_smoke_tests:
        description: Run AppImage replacement smoke against a verified predecessor
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: solin-linux-manual-${{ github.ref }}
  cancel-in-progress: false

env:
  SOLIN_E2E_STRICT: "1"
  APP_NAME: Solin
  PYTHON_VERSION: "3.13.12"
  DIST_DIR: dist

jobs:
  build:
    name: Ubuntu 24.04 x64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build and runtime dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update
          mapfile -t libobs_packages < <(bash scripts/build_solin.sh --print-native-packages)
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends \
            "${libobs_packages[@]}" \
            binutils \
            build-essential \
            ccache \
            cmake \
            desktop-file-utils \
            curl \
            dpkg \
            ffmpeg \
            shared-mime-info \
            patchelf \
            appstream \
            file \
            shellcheck \
            xdotool \
            xauth \
            xvfb \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-0 \
            libjavascriptcoregtk-4.1-0 \
            libva-x11-2 \
            pipewire-bin \
            gstreamer1.0-plugins-bad \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            pkg-config

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'requirements-build.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-pip-

      - name: Cache Nuitka compilation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Nuitka
          key: ${{ runner.os }}-${{ runner.arch }}-nuitka-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuitka-${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-nuitka-

      - name: Cache C compiler output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ccache-${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-ccache-

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip install -r requirements-build.txt

      - name: Read app version
        id: version
        run: python scripts/release.py metadata --github-output

      - name: Build Linux standalone
        shell: bash
        env:
          SOLIN_BUILD_DIR: ${{ github.workspace }}/build/linux
        run: xvfb-run --auto-servernum env SOLIN_PYTHON="$(command -v python)" bash scripts/build_solin.sh

      - name: Validate Linux packaging scripts
        shell: bash
        run: |
          shellcheck \
            scripts/build_solin.sh \
            scripts/package_solin_appimage.sh \
            packaging/linux/appimage/AppRun \
            packaging/linux/appimage/solin

      - name: Package AppImage
        shell: bash
        env:
          SOLIN_APPIMAGE_SKIP_BUILD: "1"
          SOLIN_BUILD_DIR: ${{ github.workspace }}/build/linux
          SOLIN_APPIMAGE_OUTPUT_DIR: ${{ github.workspace }}/dist
        run: SOLIN_PYTHON="$(command -v python)" bash scripts/package_solin_appimage.sh

      - name: Run AppImage startup smoke
        if: ${{ (inputs.release || inputs.run_packaged_smoke_test) }}
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          SOLIN_PACKAGED_EXE: ${{ github.workspace }}/dist/Solin-${{ env.APP_VERSION }}-linux-x86_64.AppImage
        run: |
          xvfb-run --auto-servernum \
            --server-args="-screen 0 1280x720x24" \
            python -m pytest tests/e2e/test_packaged_app_smoke.py::test_packaged_app_survives_startup_window -q

      - name: Download verified predecessor
        if: ${{ inputs.release || inputs.run_release_smoke_tests }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOLIN_TRANSITION_LINUX_URL: ${{ vars.SOLIN_TRANSITION_LINUX_URL }}
          SOLIN_TRANSITION_LINUX_SHA256: ${{ vars.SOLIN_TRANSITION_LINUX_SHA256 }}
        run: python scripts/release.py download-predecessor --platform linux --architecture x86_64 --output build/previous-app/Solin.AppImage --github-env SOLIN_OLD_APPIMAGE

      - name: AppImage replacement smoke
        if: ${{ inputs.release || inputs.run_release_smoke_tests }}
        env:
          SOLIN_NEW_APPIMAGE: ${{ github.workspace }}/dist/Solin-${{ env.APP_VERSION }}-linux-x86_64.AppImage
        run: xvfb-run --auto-servernum python -m pytest tests/e2e/test_linux_app_upgrade_smoke.py -q

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64
          path: |
            dist/Solin-${{ env.APP_VERSION }}-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
