# coturn TURN relay for attendees that cannot reach the hall directly. Template: ${VARS} are
# filled from hub.env by coturn-entrypoint.sh, which also appends the optional external-ip /
# allowed-peer-ip lines. Halls (Galene) mint time-limited credentials from TURN_SECRET
# (TURN REST API: username = "<expiry>:<name>", password = base64(hmac-sha1(secret, username))).

# Dual-stack: no listening-ip/relay-ip lines = all IPv4 and IPv6 addresses of the host.
listening-port=${TURN_PORT}
min-port=${TURN_MIN_PORT}
max-port=${TURN_MAX_PORT}

use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=${HUB_DOMAIN}

fingerprint
# TLS (5349) can be added later by mounting Caddy's certificate; plain UDP/TCP for now. (DTLS, the
# telnet CLI and the SOFTWARE attribute are off by default in coturn 4.18.)
no-tls
no-multicast-peers
stale-nonce=600

# Capacity limits. user-quota stays 0: Galene usernames are "<expiry>:<name>", so a per-username
# quota could lump unrelated attendees together.
total-quota=${TURN_TOTAL_QUOTA}
user-quota=0
max-bps=0

# Never relay to private, loopback, link-local, CGNAT or other special ranges (SSRF protection:
# attendees could otherwise reach services inside the hub's network). Halls and attendees are
# reached on their PUBLIC addresses (server-reflexive / relayed candidates), which stay allowed.
# Loopback peers are refused by default (no allow-loopback-peers).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
