<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Meeting</title>
<link rel="stylesheet" href="{{BASE}}/assets/app.css">
</head>
<body data-base="{{BASE}}">
<main id="app">
  <header>
    <h1 id="title">Meeting</h1>
    <p id="countdown" class="muted" hidden></p>
    <p id="connection" class="muted" hidden></p>
  </header>

  <section id="view-name" class="card" hidden>
    <form id="name-form" novalidate>
      <label for="name" data-t="yourName">Your name</label>
      <input id="name" autocomplete="name" maxlength="60" required>
      <label for="password" class="spaced" data-t="password">Meeting password</label>
      <input id="password" type="password" autocomplete="off" inputmode="numeric" maxlength="32" required>
      <fieldset class="count">
        <legend data-t="howMany">How many people are watching on this device, including you?</legend>
        <div class="count-buttons" id="count-buttons">
          <button type="button" data-count="1">1</button>
          <button type="button" data-count="2">2</button>
          <button type="button" data-count="3">3</button>
          <button type="button" data-count="4">4</button>
          <button type="button" data-count="5">5</button>
          <button type="button" data-count="more" data-t="more">More…</button>
        </div>
        <input id="count-more" type="number" min="6" max="20" inputmode="numeric" hidden>
        <button type="button" class="counted" data-count="0" data-t="alreadyCounted">Already counted</button>
      </fieldset>
      <p id="form-error" class="error" role="alert" hidden></p>
      <button type="submit" data-t="join">Join</button>
    </form>
  </section>

  <section id="view-lobby" class="card" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p class="big" data-t="waiting">Waiting to be admitted…</p>
    <p class="muted" data-t="waitingHint">The attendant will let you in shortly. Keep this page open.</p>
  </section>

  <section id="view-meeting" hidden>
    <div class="stage">
      <video id="program" playsinline autoplay></video>
      <button id="unmute" class="overlay" hidden data-t="tapForSound">Tap for sound</button>
    </div>
    <div id="live-banner" class="banner live" hidden>
      <span data-t="youAreLive">You can speak now</span>
      <button id="done" data-t="done">Done</button>
    </div>
    <div class="controls">
      <button id="hand" class="primary" data-t="raiseHand">Raise hand</button>
      <button id="part-mic" hidden data-t="micOn">Microphone on</button>
      <button id="part-cam" hidden data-t="cameraOn">Camera on</button>
    </div>
    <details class="options">
      <summary data-t="options">Options</summary>
      <label><input type="checkbox" id="audio-only"> <span data-t="audioOnly">Audio only (saves data)</span></label>
      <label><input type="checkbox" id="wake-lock"> <span data-t="keepAwake">Keep the screen on</span></label>
      <p class="muted" id="status-line"></p>
    </details>
  </section>

  <section id="view-message" class="card" hidden>
    <p class="big" id="message-text"></p>
    <button id="rejoin" hidden data-t="rejoin">Join again</button>
  </section>
</main>
<script src="{{BASE}}/assets/protocol.js"></script>
<script src="{{BASE}}/assets/app.js"></script>
</body>
</html>
