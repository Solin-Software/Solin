<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A/V probe</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #888; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #flash { position: absolute; left: 12vw; top: 14vh; width: 76vw; height: 72vh; background: #000; }
  #flash.on { background: #fff; }
  #panel { position: absolute; left: 8px; top: 6px; white-space: pre; font: 12px/1.35 ui-monospace, monospace; color: #777; }
  #start { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 20px; padding: 12px 24px; }
  #sink { position: absolute; right: 0; bottom: 0; width: 2px; height: 2px; opacity: 0.01; }
</style>
</head>
<body>
<div id="flash"></div>
<div id="panel">A/V probe: press Start, then point the webcam at this screen.</div>
<button id="start">Start</button>
<div id="sink"></div>
<script src="vendor/protocol.js"></script>
<script>
const LOG_URL = '/log';
const GALENE_WS = new URLSearchParams(location.search).get('ws') || 'ws://127.0.0.1:8443/ws';
const PERIOD_MS = 2000, BEEP_MS = 150, FLASH_MS = 200, MATCH_WINDOW_MS = 3000, DEBOUNCE_MS = 1000;
const flashEl = document.getElementById('flash');
const panel = document.getElementById('panel');
const sink = document.getElementById('sink');

const events = [];          // local stimuli: {k, tFlash, tBeep, v, a}
const results = [];         // matched: {k, vLat, aLat, sync, vRecv}
let ctx, started = 0, pending = [];

const median = a => { if (!a.length) return NaN; const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
const pct = (a, p) => { if (!a.length) return NaN; const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(s.length * p))]; };
const f = x => Number.isFinite(x) ? x.toFixed(0).padStart(5) : '    -';

// ---- stimulus: beep scheduled on the audio clock, flash aligned to its output time
function scheduleStimulus(k) {
  const t = ctx.currentTime + 0.1;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.frequency.value = 1000; gain.gain.value = 0.6;
  osc.connect(gain).connect(ctx.destination);
  osc.start(t); osc.stop(t + BEEP_MS / 1000);
  const ts = ctx.getOutputTimestamp();
  const tBeep = ts.performanceTime + (t - ts.contextTime) * 1000;
  const ev = { k, tBeep, tFlash: NaN, v: false, a: false };
  events.push(ev);
  setTimeout(() => requestAnimationFrame(now => {
    flashEl.classList.add('on');
    ev.tFlash = now + 1000 / 60;   // shown on the next vsync
    setTimeout(() => flashEl.classList.remove('on'), FLASH_MS);
  }), Math.max(0, tBeep - performance.now() - 20));
}

function match(kind, tOnset, extra) {
  for (let i = events.length - 1; i >= 0; i--) {
    const ev = events[i], t0 = kind === 'v' ? ev.tFlash : ev.tBeep;
    if (!Number.isFinite(t0) || tOnset < t0) continue;
    if (tOnset - t0 > MATCH_WINDOW_MS || ev[kind]) return;
    ev[kind] = tOnset - t0;
    if (kind === 'v') ev.vRecv = extra;
    if (ev.v !== false && ev.a !== false) {
      const r = { k: ev.k, t: Math.round((tOnset - started) / 1000), vLat: Math.round(ev.v), aLat: Math.round(ev.a),
                  sync: Math.round(ev.a - ev.v), vRecvLat: Number.isFinite(ev.vRecv) ? Math.round(ev.vRecv - ev.tFlash) : null };
      results.push(r); pending.push(r);
      if (pending.length >= 10) flush();
    }
    return;
  }
}

function flush() {
  if (!pending.length) return;
  const batch = pending; pending = [];
  for (const r of batch) fetch(LOG_URL, { method: 'POST', body: JSON.stringify(r) }).catch(() => {});
}

function render() {
  const last = results.slice(-150);   // ~5 minutes
  const col = key => last.map(r => r[key]).filter(Number.isFinite);
  const line = (name, key) => { const v = col(key); return `${name.padEnd(14)} last ${f(v.at(-1))}  med ${f(median(v))}  p95 ${f(pct(v, 0.95))}  min ${f(Math.min(...v))}  max ${f(Math.max(...v))} ms`; };
  const all = results.map(r => r.sync);
  panel.textContent =
    `A/V probe  elapsed ${((performance.now() - started) / 60000).toFixed(1)} min  stimuli ${events.length}  matched ${results.length}\n` +
    line('video g2g', 'vLat') + '\n' + line('video recv', 'vRecvLat') + '\n' + line('audio g2g', 'aLat') + '\n' +
    line('A-V sync', 'sync') + `\nsync drift: first10 med ${f(median(all.slice(0, 10)))}  last10 med ${f(median(all.slice(-10)))} ms`;
}

// ---- detectors on the received stream
function watchVideo(track) {
  const video = document.createElement('video'); video.srcObject = new MediaStream([track]); video.autoplay = true;
  video.muted = true; video.playsInline = true;
  sink.appendChild(video);
  const canvas = new OffscreenCanvas(64, 36), c2d = canvas.getContext('2d', { willReadFrequently: true });
  let lo = 255, hi = 0, prev = 0, lastOnset = 0;
  const onFrame = (now, meta) => {
    c2d.drawImage(video, 0, 0, 64, 36);
    const px = c2d.getImageData(16, 9, 32, 18).data;
    let sum = 0; for (let i = 0; i < px.length; i += 4) sum += 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    const y = sum / (px.length / 4);
    lo = Math.min(lo + 0.05, y); hi = Math.max(hi - 0.05, y);
    const mid = (lo + hi) / 2;
    if (hi - lo > 25 && prev < mid && y >= mid && now - lastOnset > DEBOUNCE_MS) {
      lastOnset = now;
      match('v', meta.expectedDisplayTime ?? now, meta.receiveTime);
    }
    prev = y;
    video.requestVideoFrameCallback(onFrame);
  };
  video.requestVideoFrameCallback(onFrame);
}

async function watchAudio(track) {
  const el = document.createElement('audio'); el.srcObject = new MediaStream([track]); el.autoplay = true; el.muted = true; sink.appendChild(el);   // Chrome needs an element to pull WebRTC audio
  const src = ctx.createMediaStreamSource(new MediaStream([track]));
  const band = ctx.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 1000; band.Q.value = 8;
  const code = `class Env extends AudioWorkletProcessor { process(inputs) { const ch = inputs[0][0]; if (ch) { let s = 0; for (let i = 0; i < ch.length; i++) s += ch[i] * ch[i]; this.port.postMessage([currentTime, Math.sqrt(s / ch.length)]); } return true; } } registerProcessor('env', Env);`;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: 'application/javascript' })));
  const node = new AudioWorkletNode(ctx, 'env');
  src.connect(band).connect(node);    // not connected to destination: no feedback into the room
  let floor = 0.001, lastOnset = 0, above = false;
  node.port.onmessage = ({ data: [t, rms] }) => {
    const tPerf = performance.now() - (ctx.currentTime - t) * 1000;
    const thr = Math.max(floor * 6, 0.01);
    if (!above && rms > thr && tPerf - lastOnset > DEBOUNCE_MS) { above = true; lastOnset = tPerf; match('a', tPerf); }
    else if (above && rms < thr / 2) above = false;
    if (!above) floor = floor * 0.995 + rms * 0.005;
  };
}

async function start() {
  document.getElementById('start')?.remove();
  ctx = new AudioContext({ latencyHint: 'interactive' });
  await document.documentElement.requestFullscreen().catch(() => {});
  const group = new URLSearchParams(location.search).get('group') || 'g1';
  const sc = new ServerConnection();
  const seen = new Set();
  sc.onconnected = function () { this.join(group, 'probe-' + Date.now(), 'x'); };
  sc.onjoined = function (kind) { if (kind === 'join') this.request({ '': ['audio', 'video'] }); };
  sc.ondownstream = function (stream) {
    stream.ondowntrack = (track) => {
      if (seen.has(track.id)) return; seen.add(track.id);
      if (track.kind === 'video') watchVideo(track); else watchAudio(track);
    };
  };
  await sc.connect(GALENE_WS);
  started = performance.now();
  let k = 0;
  scheduleStimulus(k++);
  setInterval(() => scheduleStimulus(k++), PERIOD_MS);
  setInterval(render, 500);
  setInterval(flush, 10000);
}
document.getElementById('start').onclick = start;
if (new URLSearchParams(location.search).has('auto')) start();
</script>
</body>
</html>
