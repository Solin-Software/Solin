name: Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "src/solin/resources/translations/locales/*.json"
      - "src/solin/resources/translations/locales/**/*.json"
      - "src/solin/resources/translations/*.ts"
      - "src/solin/resources/translations/**/*.ts"
      - "src/solin/resources/translations/*.qm"
      - "src/solin/resources/translations/**/*.qm"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13.12"
  QT_QPA_PLATFORM: offscreen

jobs:
  changes:
    name: Change Filter
    runs-on: ubuntu-24.04
    outputs:
      run_quality: ${{ steps.filter.outputs.run_quality }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect quality-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_quality=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ "$base" =~ ^0+$ ]]; then
            mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r "$head")
          else
            mapfile -t changed_files < <(git diff --name-only "$base" "$head")
          fi

          run_quality=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              src/solin/resources/translations/locales/*.json|src/solin/resources/translations/*.ts|src/solin/resources/translations/*.qm)
                ;;
              *)
                run_quality=true
                break
                ;;
            esac
          done

          echo "run_quality=$run_quality" >> "$GITHUB_OUTPUT"

  lint:
    name: Ruff Lint
    needs: changes
    if: ${{ needs.changes.outputs.run_quality == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff==0.15.16

      - name: Ruff lint
        run: python -m ruff check .

  test:
    name: Tests and Typecheck
    needs: changes
    if: ${{ needs.changes.outputs.run_quality == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 \
            libgl1 \
            libgtk-3-dev \
            libopengl0 \
            libpulse0 \
            libwebkit2gtk-4.1-dev \
            libxcb-cursor0 \
            libxkbcommon-x11-0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt -e .

      - name: Pyright typecheck
        run: python -m pyright --pythonpath "$(command -v python)"

      - name: Pytest
        run: python -m pytest

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    needs:
      - changes
      - lint
      - test
    if: ${{ always() }}

    steps:
      - name: Verify quality result
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change filter failed."
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.run_quality }}" == "true" && "${{ needs.lint.result }}" != "success" ]]; then
            echo "Ruff lint failed."
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.run_quality }}" == "true" && "${{ needs.test.result }}" != "success" ]]; then
            echo "Tests or typecheck failed. Check the 'Tests and Typecheck' job logs for details."
            exit 1
          fi

          echo "Quality gate passed."
