name: Build Solin macOS

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: Artifact retention in days
        required: true
        type: number
        default: 5
      run_release_smoke_tests:
        description: Run packaged startup and app replacement smoke tests
        required: true
        type: boolean
        default: true
      previous_macos_dmg_url:
        description: Previous production DMG used for app replacement smoke
        required: true
        type: string
        default: "https://github.com/Solin-Software/solin-releases/releases/download/26.17.0/Solin-26.17.0-macOS.dmg"

permissions:
  contents: read

concurrency:
  group: solin-macos-manual-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: Solin
  PYTHON_VERSION: "3.13.12"
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  BUILD_DIR: build
  DIST_DIR: dist
  NUITKA_CACHE_DIR: ${{ github.workspace }}/.cache/nuitka

jobs:
  build:
    name: macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/pip
            .pip-wheels
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-pip-

      - name: Cache Nuitka and C compilation
        uses: actions/cache@v4
        with:
          path: .cache/nuitka
          key: ${{ runner.os }}-${{ runner.arch }}-nuitka-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuitka-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}-
            ${{ runner.os }}-${{ runner.arch }}-nuitka-${{ env.PYTHON_VERSION }}-

      - name: Read app version
        id: version
        shell: bash
        run: |
          python - <<'PY' | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"
          from pathlib import Path

          namespace = {}
          exec(Path("src/solin/version.py").read_text(encoding="utf-8"), namespace)
          internal_version = namespace["__version__"]
          parts = internal_version.split(".")
          if len(parts) != 4 or not all(part.isdigit() for part in parts):
              raise SystemExit(f"Version must use MAJOR.MINOR.PATCH.BUILD format. Got: {internal_version}")
          macos_version = ".".join(parts[:3])
          print(f"APP_VERSION={macos_version}")
          print(f"app_version={macos_version}")
          print(f"APP_INTERNAL_VERSION={internal_version}")
          PY

      - name: Verify required macOS inputs
        shell: bash
        run: |
          test -f main.py
          test -f src/solin/resources/assets/icon.icns
          test -d src/solin/qml
          test -d src/solin/resources/translations/locales
          test -d src/solin/resources/translations
          test -f src/native_webview_widget/__init__.py
          test -f src/native_webview_widget/abi.py
          test -f src/native_webview_widget/_backend.py
          test -f src/native_webview_widget/widget.py

          if [ -f src/native_webview_widget/libnative_webview_widget.dylib ]; then
            echo "NATIVE_WEBVIEW_DYLIB=src/native_webview_widget/libnative_webview_widget.dylib" >> "$GITHUB_ENV"
          elif [ -f src/native_webview_widget/native_webview_widget.dylib ]; then
            echo "NATIVE_WEBVIEW_DYLIB=src/native_webview_widget/native_webview_widget.dylib" >> "$GITHUB_ENV"
          else
            echo "::error::Missing macOS native webview dylib. Build or vendor libnative_webview_widget.dylib into src/native_webview_widget/ before running this workflow."
            exit 1
          fi

      - name: Install Python dependencies
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          python -m pip install --upgrade --retries 10 --timeout 120 pip
          mkdir -p .pip-wheels
          python -m pip download \
            --requirement requirements-dev.txt \
            --dest .pip-wheels \
            --only-binary=:all: \
            --retries 10 \
            --timeout 120 \
            --progress-bar off
          python -m pip install \
            --no-index \
            --find-links .pip-wheels \
            --requirement requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip install --upgrade --retries 10 --timeout 120 --prefer-binary nuitka ordered-set zstandard

      - name: Quality gate
        shell: bash
        run: |
          python -m ruff check .
          python -m pyright --pythonpath "$(command -v python)"
          python -m pytest

      - name: Generate compiled QML cache
        shell: bash
        run: |
          rm -rf "${BUILD_DIR}/qmlcache/solin/qml"
          python scripts/compile_qml_cache.py \
            --source-dir src/solin/qml \
            --output-dir "${BUILD_DIR}/qmlcache/solin/qml/Solin" \
            --qt-qml-output-dir "${BUILD_DIR}/qmlcache/PySide6/qml" \
            --qt-framework-output-dir "${BUILD_DIR}/qmlcache/qt-libs"

      - name: Remove Homebrew OpenSSL unversioned symlinks
        shell: bash
        run: |
          brew unlink openssl@3 2>/dev/null || true
          brew unlink openssl@1.1 2>/dev/null || true

      - name: Build app bundle with Nuitka
        shell: bash
        run: |
          qml_binary_args=()
          if find "${BUILD_DIR}/qmlcache/PySide6/qml" -name "*.dylib" -print -quit | grep -q .; then
            qml_binary_args+=("--include-data-files=${BUILD_DIR}/qmlcache/PySide6/qml=PySide6/qml/=**/*.dylib")
          fi
          if find "${BUILD_DIR}/qmlcache/PySide6/qml" -name "*.so" -print -quit | grep -q .; then
            qml_binary_args+=("--include-data-files=${BUILD_DIR}/qmlcache/PySide6/qml=PySide6/qml/=**/*.so")
          fi

          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-console-mode=disable \
            --output-dir="${BUILD_DIR}" \
            --macos-app-name="${APP_NAME}" \
            --macos-app-version="${APP_VERSION}" \
            --macos-app-icon="src/solin/resources/assets/icon.icns" \
            --assume-yes-for-downloads \
            --follow-imports \
            --follow-import-to=solin \
            --follow-import-to=solin.core \
            --follow-import-to=solin.styles \
            --follow-import-to=solin.widgets \
            --nofollow-import-to=PySide6.QtTranslations \
            --include-package=solin \
            --include-package=solin.core \
            --include-package=solin.styles \
            --include-package=solin.widgets \
            --include-package=native_webview_widget \
            --noinclude-dlls="native_webview_widget/*.so" \
            --noinclude-dlls="native_webview_widget/*.dll" \
            --noinclude-data-files="native_webview_widget/*.so" \
            --noinclude-data-files="native_webview_widget/*.dll" \
            --include-module=websocket \
            --include-module=websocket._core \
            --include-module=websocket._app \
            --include-package=ephem \
            --include-package-data=pyqttoast \
            --include-data-dir=src/solin/resources/assets=solin/resources/assets \
            --include-data-dir=src/solin/resources/translations/locales=solin/resources/translations/locales \
            --include-data-dir="${BUILD_DIR}/qmlcache/solin/qml/Solin=solin/qml/Solin" \
            --include-data-dir="${BUILD_DIR}/qmlcache/PySide6/qml=PySide6/qml" \
            "${qml_binary_args[@]}" \
            --include-data-files="src/solin/resources/translations/*.qm=solin/resources/translations/" \
            --include-data-files="${NATIVE_WEBVIEW_DYLIB}=native_webview_widget/$(basename "${NATIVE_WEBVIEW_DYLIB}")" \
            --enable-plugin=pyside6 \
            --include-qt-plugins=platforms,styles,imageformats,multimedia,position \
            main.py

      - name: Rename bundle
        shell: bash
        run: |
          echo "=== ${BUILD_DIR} contents after Nuitka ==="
          ls -la "${BUILD_DIR}/"
          if [ -d "${BUILD_DIR}/main.app" ]; then
            mv "${BUILD_DIR}/main.app" "${BUILD_DIR}/${APP_NAME}.app"
          fi
          test -d "${BUILD_DIR}/${APP_NAME}.app"

      - name: Normalize macOS Qt QML runtime links
        shell: bash
        run: |
          BUNDLE="${BUILD_DIR}/${APP_NAME}.app"
          MACOS_DIR="$BUNDLE/Contents/MacOS"
          QT_LIB_SOURCE="${BUILD_DIR}/qmlcache/qt-libs"
          test -d "$QT_LIB_SOURCE"

          while IFS= read -r library; do
            name="$(basename "$library")"
            target="$MACOS_DIR/$name"
            if [ ! -f "$target" ]; then
              cp "$library" "$target"
              chmod 755 "$target"
              echo "Staged $name"
            fi
          done < <(find "$QT_LIB_SOURCE" -maxdepth 1 -type f -name "Qt*" | sort)

          for duplicate_dir in "$BUNDLE/Contents/Frameworks/PySide6/lib" "$BUNDLE/Contents/MacOS/PySide6/lib"; do
            if [ -d "$duplicate_dir" ]; then
              find "$duplicate_dir" -maxdepth 1 -name "Qt*.framework" -type d -prune -exec rm -rf {} +
            fi
          done

          runtime_binaries=()
          while IFS= read -r binary; do runtime_binaries+=("$binary"); done < <(
            find "$BUNDLE" \
              \( -path "*/PySide6/qml/QtQuick/*.dylib" \
              -o -path "*/PySide6/qml/QtQuick/Layouts/*.dylib" \
              -o -path "*/PySide6/qml/QtQuick/Controls/*.dylib" \
              -o -path "*/PySide6/qml/QtQuick/Controls/Basic/*.dylib" \
              -o -path "*/PySide6/qml/QtQuick/Templates/*.dylib" \
              -o -path "*/PySide6/qml/QtQml/*.dylib" \
              -o -path "*/PySide6/qml/QtMultimedia/*.dylib" \) \
              -type f
          )
          while IFS= read -r binary; do runtime_binaries+=("$binary"); done < <(
            find "$MACOS_DIR" -maxdepth 1 -type f -name "Qt*"
          )

          missing=()
          for binary in "${runtime_binaries[@]}"; do
            chmod u+w "$binary"
            name="$(basename "$binary")"
            if [[ "$name" == Qt* ]]; then
              install_name_tool -id "@executable_path/$name" "$binary" || true
            fi
            while IFS='|' read -r dependency framework; do
              if [ -z "$dependency" ]; then
                continue
              fi
              if [ ! -f "$MACOS_DIR/$framework" ]; then
                missing+=("${binary} -> ${framework}")
                continue
              fi
              install_name_tool -change "$dependency" "@executable_path/$framework" "$binary"
            done < <(otool -L "$binary" | sed -n 's#^[[:space:]]*\(@rpath/\(Qt[^./]*\)\.framework/[^[:space:]]*\).*#\1|\2#p' | sort -u)
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '%s\n' "${missing[@]}" | sed 's/^/::error::Missing flat Qt runtime library: /'
            exit 1
          fi

      - name: Verify compiled QML deployment
        shell: bash
        run: |
          BUNDLE="${BUILD_DIR}/${APP_NAME}.app"
          find "$BUNDLE" -path "*/solin/qml/*.qmlc" -not -path "*/solin/qml/Solin/*" -delete
          find "$BUNDLE" -path "*/solin/qml/*.qml" -not -path "*/solin/qml/Solin/*" -delete
          find "$BUNDLE" -path "*/solin/qml/qmldir" -delete
          if ! find "$BUNDLE" -path "*/solin/qml/Solin/*.qmlc" -print -quit | grep -q .; then
            echo "::error::Compiled QML cache files were not packaged in the app bundle."
            exit 1
          fi
          find "$BUNDLE" -path "*/solin/qml/Solin/*.qml" -delete
          if ! find "$BUNDLE" -path "*/solin/qml/Solin/qmldir" -print -quit | grep -q .; then
            echo "::error::Compiled QML qmldir metadata was not packaged in the app bundle."
            exit 1
          fi
          if find "$BUNDLE" -path "*/solin/qml/Solin/*.qml" -print -quit | grep -q .; then
            echo "::error::Raw QML source files remained in the app bundle."
            exit 1
          fi
          if ! find "$BUNDLE" -path "*/PySide6/qml/QtQuick/qmldir" -print -quit | grep -q .; then
            echo "::error::QtQuick QML runtime was not packaged in the app bundle."
            exit 1
          fi
          if ! find "$BUNDLE" -path "*/PySide6/qml/QtQml/qmldir" -print -quit | grep -q .; then
            echo "::error::QtQml QML runtime was not packaged in the app bundle."
            exit 1
          fi
          if ! find "$BUNDLE" -path "*/PySide6/qml/QtMultimedia/*quickmultimediaplugin*" -print -quit | grep -q .; then
            echo "::error::QtMultimedia QML plugin was not packaged in the app bundle."
            exit 1
          fi
          if ! find "$BUNDLE" \( -path "*/PySide6/qml/QtQuick/Layouts/*qquicklayoutsplugin*.dylib" -o -path "*/PySide6/qml/QtQuick/Layouts/*qquicklayoutsplugin*.so" \) -print -quit | grep -q .; then
            echo "::error::qquicklayoutsplugin binary was not packaged in the app bundle."
            exit 1
          fi
          if ! find "$BUNDLE" \( -path "*/PySide6/qml/QtQuick/Controls/*qtquickcontrols2plugin*.dylib" -o -path "*/PySide6/qml/QtQuick/Controls/*qtquickcontrols2plugin*.so" \) -print -quit | grep -q .; then
            echo "::error::qtquickcontrols2plugin binary was not packaged in the app bundle."
            exit 1
          fi
          if ! find "$BUNDLE" \( -path "*/PySide6/qml/QtQuick/Controls/Basic/*qtquickcontrols2basicstyleplugin*.dylib" -o -path "*/PySide6/qml/QtQuick/Controls/Basic/*qtquickcontrols2basicstyleplugin*.so" \) -print -quit | grep -q .; then
            echo "::error::qtquickcontrols2basicstyleplugin binary was not packaged in the app bundle."
            exit 1
          fi
          if ! find "$BUNDLE" \( -path "*/PySide6/qml/QtQuick/Templates/*qtquicktemplates2plugin*.dylib" -o -path "*/PySide6/qml/QtQuick/Templates/*qtquicktemplates2plugin*.so" \) -print -quit | grep -q .; then
            echo "::error::qtquicktemplates2plugin binary was not packaged in the app bundle."
            exit 1
          fi
          if find "$BUNDLE" -path "*/PySide6/lib/Qt*.framework" -print -quit | grep -q .; then
            echo "::error::Qt frameworks must not be packaged under PySide6/lib because they duplicate Nuitka's Qt runtime."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtQuickLayouts"; then
            echo "::error::QtQuickLayouts runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtQuickControls2Basic"; then
            echo "::error::QtQuickControls2Basic runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtQuickControls2BasicStyleImpl"; then
            echo "::error::QtQuickControls2BasicStyleImpl runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtQml"; then
            echo "::error::QtQml runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtQmlMeta"; then
            echo "::error::QtQmlMeta runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtQuick"; then
            echo "::error::QtQuick runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtCore"; then
            echo "::error::QtCore runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtDBus"; then
            echo "::error::QtDBus runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtOpenGL"; then
            echo "::error::QtOpenGL runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtQuickControls2Impl"; then
            echo "::error::QtQuickControls2Impl runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtQuickTemplates2"; then
            echo "::error::QtQuickTemplates2 runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtMultimedia"; then
            echo "::error::QtMultimedia runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          if ! test -f "$BUNDLE/Contents/MacOS/QtMultimediaQuick"; then
            echo "::error::QtMultimediaQuick runtime library was not packaged in Contents/MacOS."
            exit 1
          fi
          runtime_binaries=()
          while IFS= read -r binary; do runtime_binaries+=("$binary"); done < <(
            find "$BUNDLE" \
              \( -path "*/PySide6/qml/QtQuick/libqtquick2plugin.dylib" \
              -o -path "*/PySide6/qml/QtQuick/Layouts/*qquicklayoutsplugin*.dylib" \
              -o -path "*/PySide6/qml/QtQuick/Controls/*qtquickcontrols2plugin*.dylib" \
              -o -path "*/PySide6/qml/QtQuick/Controls/Basic/*qtquickcontrols2basicstyleplugin*.dylib" \
              -o -path "*/PySide6/qml/QtQuick/Templates/*qtquicktemplates2plugin*.dylib" \
              -o -path "*/PySide6/qml/QtQml/*.dylib" \
              -o -path "*/PySide6/qml/QtMultimedia/*.dylib" \) \
              -type f
          )
          while IFS= read -r binary; do runtime_binaries+=("$binary"); done < <(
            find "$BUNDLE/Contents/MacOS" -maxdepth 1 -type f -name "Qt*"
          )

          missing=()
          for binary in "${runtime_binaries[@]}"; do
            while IFS= read -r dependency; do
              missing+=("${binary} -> ${dependency}")
            done < <(otool -L "$binary" | sed -n 's#.*\(@rpath/Qt[^[:space:]]*\.framework/[^[:space:]]*\).*#\1#p' | sort -u)
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '%s\n' "${missing[@]}" | sed 's/^/::error::Unnormalized Qt framework dependency: /'
            exit 1
          fi
          echo "App QML packaged as compiled .qmlc cache only."

      - name: Ad-hoc sign app bundle
        shell: bash
        run: |
          codesign --force --deep --sign - "${BUILD_DIR}/${APP_NAME}.app"
          codesign --verify --deep --strict --verbose=2 "${BUILD_DIR}/${APP_NAME}.app"

      - name: Inspect app bundle
        shell: bash
        run: |
          BUNDLE="${BUILD_DIR}/${APP_NAME}.app"
          echo "=== Top-level bundle layout ==="
          find "$BUNDLE/Contents" -maxdepth 2 -type d | sort
          echo ""
          echo "=== Native webview dylibs ==="
          find "$BUNDLE" -iname "*native_webview*.dylib" -o -iname "native_webview_widget.dll" | sort
          echo ""
          echo "=== Bundle size ==="
          du -sh "$BUNDLE"

      - name: Verify executable
        shell: bash
        run: |
          BINARY="${BUILD_DIR}/${APP_NAME}.app/Contents/MacOS/main"
          if [ ! -x "$BINARY" ]; then
            echo "::error::Executable not found at $BINARY"
            exit 1
          fi
          echo "[OK] $BINARY"

      - name: Install create-dmg
        shell: bash
        run: brew install create-dmg

      - name: Create DMG
        shell: bash
        run: |
          mkdir -p "${DIST_DIR}"
          create-dmg \
            --volname "${APP_NAME} ${APP_VERSION}" \
            --volicon "src/solin/resources/assets/icon.icns" \
            --window-pos 200 120 \
            --window-size 660 420 \
            --icon-size 128 \
            --icon "${APP_NAME}.app" 165 195 \
            --hide-extension "${APP_NAME}.app" \
            --app-drop-link 495 195 \
            --no-internet-enable \
            "${DIST_DIR}/${APP_NAME}-${APP_VERSION}-macOS.dmg" \
            "${BUILD_DIR}/${APP_NAME}.app" \
          || [ $? -eq 2 ]

          shasum -a 256 "${DIST_DIR}"/*.dmg > "${DIST_DIR}/SHA256SUMS-macos.txt"
          ls -lh "${DIST_DIR}/"

      - name: Locate newly built macOS DMG
        if: ${{ inputs.run_release_smoke_tests }}
        shell: bash
        run: |
          set -euo pipefail
          dmgs=()
          while IFS= read -r dmg; do
            dmgs+=("$dmg")
          done < <(find "$DIST_DIR" -maxdepth 1 -name "*.dmg" -type f | sort)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            printf '%s\n' "${dmgs[@]}" | sed 's/^/found DMG: /'
            echo "::error::Expected exactly one newly built DMG, found ${#dmgs[@]}."
            exit 1
          fi
          echo "SOLIN_NEW_MACOS_DMG=${PWD}/${dmgs[0]}" >> "$GITHUB_ENV"
          ls -lh "${dmgs[0]}"

      - name: Download previous macOS DMG
        if: ${{ inputs.run_release_smoke_tests }}
        shell: bash
        run: |
          set -euo pipefail
          url="${{ inputs.previous_macos_dmg_url }}"
          if [ -z "${url//[[:space:]]/}" ]; then
            echo "::error::previous_macos_dmg_url must not be empty when release smoke tests are enabled."
            exit 1
          fi

          out_dir="${BUILD_DIR}/previous-dmg"
          mkdir -p "$out_dir"
          old_dmg="${PWD}/${out_dir}/${APP_NAME}_previous.dmg"
          curl --fail --location --retry 3 --retry-delay 5 --output "$old_dmg" "$url"
          if [ ! -s "$old_dmg" ]; then
            echo "::error::Downloaded previous DMG is empty: $old_dmg"
            exit 1
          fi
          echo "SOLIN_OLD_MACOS_DMG=$old_dmg" >> "$GITHUB_ENV"
          ls -lh "$old_dmg"

      - name: Extract macOS release apps
        if: ${{ inputs.run_release_smoke_tests }}
        shell: bash
        run: |
          set -euo pipefail
          mount_roots=()
          mount_points=()

          cleanup() {
            for mount_point in "${mount_points[@]}"; do
              hdiutil detach "$mount_point" -quiet || true
            done
            for mount_root in "${mount_roots[@]}"; do
              rm -rf "$mount_root"
            done
          }
          trap cleanup EXIT

          extract_app() {
            local dmg="$1"
            local output_dir="$2"
            local env_name="$3"
            local mount_root
            local mount_point
            local app_source

            mount_root="$(mktemp -d "${RUNNER_TEMP}/solin-dmg.XXXXXX")"
            mount_point="${mount_root}/mount"
            mkdir -p "$mount_point"
            mount_roots+=("$mount_root")
            mount_points+=("$mount_point")

            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point" -quiet
            app_source="$(find "$mount_point" -maxdepth 2 -name "${APP_NAME}.app" -type d -print -quit)"
            if [ -z "$app_source" ]; then
              echo "::error::${APP_NAME}.app was not found in $dmg"
              exit 1
            fi

            rm -rf "$output_dir"
            mkdir -p "$output_dir"
            ditto "$app_source" "${output_dir}/${APP_NAME}.app"
            if [ ! -x "${output_dir}/${APP_NAME}.app/Contents/MacOS/main" ]; then
              echo "::error::App executable was not found after extraction from $dmg."
              exit 1
            fi
            echo "${env_name}=${PWD}/${output_dir}/${APP_NAME}.app" >> "$GITHUB_ENV"
          }

          extract_app "$SOLIN_OLD_MACOS_DMG" "${BUILD_DIR}/previous-app" "SOLIN_OLD_MACOS_APP"
          extract_app "$SOLIN_NEW_MACOS_DMG" "${BUILD_DIR}/new-dmg-app" "SOLIN_NEW_MACOS_APP"

      - name: Run macOS app replacement smoke
        if: ${{ inputs.run_release_smoke_tests }}
        shell: bash
        env:
          SOLIN_E2E_STARTUP_SECONDS: "8"
        run: |
          python -m pytest tests/e2e/test_macos_app_upgrade_smoke.py -q

      - name: Run packaged startup smoke
        if: ${{ inputs.run_release_smoke_tests }}
        shell: bash
        env:
          SOLIN_E2E_STARTUP_SECONDS: "8"
        run: |
          export SOLIN_PACKAGED_EXE="${SOLIN_NEW_MACOS_APP}/Contents/MacOS/main"
          python -m pytest tests/e2e/test_packaged_app_smoke.py -q

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Solin-${{ steps.version.outputs.app_version }}-macOS
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
