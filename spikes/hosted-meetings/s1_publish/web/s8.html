<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reunião (teste)</title>
<style>
  :root { --bg: #0f1115; --card: #1a1d24; --text: #eef0f4; --muted: #9aa3b2; --accent: #4f8cff; --ok: #3ccf7a; --warn: #f0b429; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; font-weight: 600; margin: 8px 0 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; color: var(--muted); font-size: 16px; margin-bottom: 6px; }
  input { width: 100%; font-size: 20px; padding: 12px; border-radius: 10px; border: 1px solid #333a46; background: #0c0e12; color: var(--text); }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button { width: 64px; height: 64px; font-size: 32px; border-radius: 12px; border: 0; background: #2a3040; color: var(--text); }
  .stepper output { font-size: 34px; min-width: 56px; text-align: center; }
  .big { width: 100%; font-size: 22px; padding: 18px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 600; }
  .big.hand { background: #2a3040; }
  .big.hand.up { background: var(--warn); color: #222; }
  video { width: 100%; border-radius: 12px; background: #000; display: block; }
  #banner { display: none; background: var(--warn); color: #222; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-weight: 600; }
  #status { color: var(--muted); font-size: 15px; margin-top: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Reunião da congregação (teste)</h1>
  <div id="banner">Reconectando…</div>

  <section id="joinCard" class="card">
    <label for="name">Seu nome ou família</label>
    <input id="name" autocomplete="name" placeholder="Ex.: Família Silva">
    <div style="height:14px"></div>
    <label>Quantas pessoas estão assistindo com você (incluindo você)?</label>
    <div class="stepper">
      <button id="minus" aria-label="menos">−</button>
      <output id="count">1</output>
      <button id="plus" aria-label="mais">+</button>
    </div>
    <div style="height:16px"></div>
    <button id="join" class="big">Entrar na reunião</button>
  </section>

  <section id="meetingCard" class="card hidden">
    <video id="v" playsinline autoplay></video>
    <div style="height:12px"></div>
    <button id="hand" class="big hand">✋ Levantar a mão</button>
    <div id="status"></div>
  </section>
</main>
<script src="vendor/livekit-client.umd.js"></script>
<script>
// S8: attendee page for real-device tests. Remembers name/device id, asks attendance once per
// meeting, auto-rejoins, and logs visibility / audio level / video frames / data / battery.
const LK = LivekitClient;
const MEETING = 's8-' + new Date().toISOString().slice(0, 10);
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const deviceId = store.get('device_id') || (() => { const id = 'dev-' + Math.random().toString(36).slice(2, 10); store.set('device_id', id); return id; })();
const $ = id => document.getElementById(id);
let count = parseInt(store.get('attendance:' + MEETING) || '1', 10);
$('name').value = store.get('name') || '';
$('count').textContent = count;
$('minus').onclick = () => { count = Math.max(0, count - 1); $('count').textContent = count; };
$('plus').onclick = () => { count = Math.min(20, count + 1); $('count').textContent = count; };
if (store.get('attendance:' + MEETING)) $('join').textContent = 'Entrar novamente';

const post = rec => fetch('log', { method: 'POST', body: JSON.stringify({ test: 's8', device: deviceId, ua: navigator.userAgent, t: Date.now(), ...rec }) }).catch(() => {});
let room = null, videoTrack = null, analyser = null, handUp = false, wantConnected = false;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function attach(track) {
  if (track.kind === 'video') { videoTrack = track; track.attach($('v')); return; }
  const el = track.attach(); el.playsInline = true; document.body.appendChild(el);
  try {
    const src = audioCtx.createMediaStreamSource(new MediaStream([track.mediaStreamTrack]));
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024; src.connect(analyser);
  } catch (e) { post({ event: 'analyser_error', error: String(e) }); }
}

async function connect() {
  const name = $('name').value.trim() || 'Sem nome';
  const { token, url } = await (await fetch(`token?identity=${deviceId}&room=s8`)).json();
  const r = new LK.Room({ adaptiveStream: true, dynacast: true });
  room = r;
  // Events from an older room object (replaced by a rejoin) are ignored.
  r.on(LK.RoomEvent.TrackSubscribed, t => { if (r === room) attach(t); });
  r.on(LK.RoomEvent.Reconnecting, () => { if (r !== room) return; $('banner').style.display = 'block'; post({ event: 'reconnecting' }); });
  r.on(LK.RoomEvent.Reconnected, () => { if (r !== room) return; $('banner').style.display = 'none'; post({ event: 'reconnected' }); });
  r.on(LK.RoomEvent.Disconnected, () => { if (r !== room) return; post({ event: 'disconnected' }); if (wantConnected) rejoin(); });
  await r.connect(url, token);
  await room.localParticipant.setName(name).catch(() => {});
  await room.localParticipant.setAttributes({ attendance: String(count), hand: handUp ? String(Date.now()) : '' }).catch(() => {});
  $('banner').style.display = 'none';
}

async function rejoin() {
  $('banner').style.display = 'block';
  for (let attempt = 1; wantConnected; attempt++) {
    await new Promise(r => setTimeout(r, Math.min(1000 * attempt, 8000)));
    try { await connect(); post({ event: 'rejoined', attempt }); keepAlive(); return; } catch (e) { post({ event: 'rejoin_failed', attempt, error: String(e) }); }
  }
}

$('join').onclick = async () => {
  store.set('name', $('name').value.trim());
  store.set('attendance:' + MEETING, String(count));
  await audioCtx.resume().catch(() => {});
  $('join').disabled = true;
  try {
    wantConnected = true;
    await connect();
    $('joinCard').classList.add('hidden'); $('meetingCard').classList.remove('hidden');
    post({ event: 'joined', attendance: count });
    keepAlive();
  } catch (e) { $('join').disabled = false; alert('Não foi possível entrar: ' + e); post({ event: 'join_error', error: String(e) }); }
};

$('hand').onclick = async () => {
  handUp = !handUp;
  $('hand').classList.toggle('up', handUp);
  $('hand').textContent = handUp ? '✋ Mão levantada (toque para baixar)' : '✋ Levantar a mão';
  await room?.localParticipant.setAttributes({ hand: handUp ? String(Date.now()) : '' }).catch(() => {});
  post({ event: handUp ? 'hand_up' : 'hand_down' });
};

// Keep-alive while in the meeting: Media Session (the page is "playing audio") + screen wake lock.
let wakeLock = null;
async function keepAlive() {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Reunião da congregação', artist: 'Ao vivo' });
    navigator.mediaSession.playbackState = 'playing';
  }
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); post({ event: 'wakelock', ok: true }); } }
  catch (e) { post({ event: 'wakelock', ok: false, error: String(e) }); }
}

// Fast recovery when the page comes back: if no media within 3 s, drop the stale session and rejoin.
let framesAtVisible = null;
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !wantConnected) return;
  keepAlive();
  const before = await framesNow();
  setTimeout(async () => {
    const after = await framesNow();
    if (after === null || after === before) {
      post({ event: 'stale_on_visible', before, after });
      try { await room?.disconnect(); } catch {}
      // the Disconnected handler triggers rejoin()
    }
  }, 3000);
});
async function framesNow() {
  try { const rep = await videoTrack?.getRTCStatsReport(); let f = null; rep?.forEach(s => { if (s.type === 'inbound-rtp' && s.kind === 'video') f = s.framesDecoded; }); return f; } catch { return null; }
}

// Diagnostics every 10 s.
let lastFrames = 0, battery = null;
if (navigator.getBattery) navigator.getBattery().then(b => { battery = b; }).catch(() => {});
document.addEventListener('visibilitychange', () => post({ event: 'visibility', state: document.visibilityState }));
setInterval(async () => {
  if (!room) return;
  let level = null;
  if (analyser) { const buf = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(buf); level = Math.sqrt(buf.reduce((s, x) => s + x * x, 0) / buf.length); }
  let frames = null, bytes = 0, w = null, h = null;
  try {
    for (const t of [videoTrack, ...[...room.remoteParticipants.values()].flatMap(p => [...p.audioTrackPublications.values()].map(x => x.track))].filter(Boolean)) {
      const rep = await t.getRTCStatsReport();
      rep?.forEach(s => { if (s.type === 'inbound-rtp') { bytes += s.bytesReceived || 0; if (s.kind === 'video') { frames = s.framesDecoded; w = s.frameWidth; h = s.frameHeight; } } });
    }
  } catch {}
  const rec = { event: 'tick', visible: document.visibilityState, audio_level: level === null ? null : +level.toFixed(4),
                audio_ctx: audioCtx.state, video_frames_10s: frames === null ? null : frames - lastFrames, video: w ? `${w}x${h}` : null,
                data_mb: +(bytes / 1e6).toFixed(2), battery: battery ? Math.round(battery.level * 100) : null, charging: battery ? battery.charging : null };
  if (frames !== null) lastFrames = frames;
  $('status').textContent = `${rec.video || '—'} · dados ${rec.data_mb} MB${rec.battery !== null ? ' · bateria ' + rec.battery + '%' : ''}`;
  post(rec);
}, 10000);
</script>
</body>
</html>
