name: Build Solin Windows

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: true
      retention_days:
        type: number
        default: 5
  workflow_dispatch:
    inputs:
      retention_days:
        description: Artifact retention in days
        required: true
        type: number
        default: 5
      run_release_smoke_tests:
        description: Run packaged startup and installer upgrade smoke tests
        required: true
        type: boolean
        default: true
permissions:
  contents: read

concurrency:
  group: solin-windows-manual-${{ github.ref }}
  cancel-in-progress: false

env:
  SOLIN_E2E_STRICT: "1"
  APP_NAME: Solin
  PYTHON_VERSION: "3.13.12"
  BUILD_DIR: build
  DIST_DIR: dist
  COMPANY_NAME: Solin Software
  PRODUCT_NAME: Solin
  FILE_DESCRIPTION: Solin - Audio and Video for Kingdom Hall meetings
  COPYRIGHT: Copyright (c) 2026 Alexsander. All rights reserved.

jobs:
  build:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'requirements-build.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-pip-

      - name: Cache Nuitka compilation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\Nuitka
          key: ${{ runner.os }}-${{ runner.arch }}-nuitka-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuitka-${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-nuitka-

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
          pip install -r requirements-build.txt

      - name: Read app version
        id: version
        run: python scripts/release.py metadata --github-output

      - name: Cache pinned GStreamer installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/downloads/gstreamer-1.0-msvc-x86_64-*.exe
          key: gstreamer-msvc-x86_64-${{ hashFiles('scripts/install_gstreamer_windows.ps1') }}

      - name: Cache pinned Qt bridge SDK archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/downloads/qt-bridge-sdk
          key: qt-bridge-sdk-6.11.1-${{ hashFiles('scripts/install_qt_bridge_sdk_windows.ps1') }}

      - name: Build and test native media engine with GStreamer
        shell: pwsh
        run: python scripts\build_native_engine.py --configuration Release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.5.4 --yes --no-progress --allow-downgrade

      - name: Verify required build inputs
        shell: pwsh
        run: |
          $required = @(
            "main.py",
            "src\solin\resources\assets\icon.ico",
            "src\solin\qml",
            "src\solin\resources\translations\locales",
            "src\solin\resources\translations",
            "packaging\windows\installer\setup.iss"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required build input is missing: $path"
            }
          }

      - name: Generate compiled QML cache
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:BUILD_DIR\qmlcache\solin\qml" -Recurse -Force -ErrorAction SilentlyContinue
          python scripts\compile_qml_cache.py `
            --source-dir "src\solin\qml" `
            --output-dir "$env:BUILD_DIR\qmlcache\solin\qml\Solin" `
            --qt-qml-output-dir "$env:BUILD_DIR\qmlcache\PySide6\qml" `
            --qt-library-output-dir "$env:BUILD_DIR\qmlcache\qt-libs" `
            --qt-qml-module "QtQuick/Controls/impl" `
            --qt-qml-module "QtQuick/Controls/Basic/impl"

      - name: Build standalone app with Nuitka
        shell: pwsh
        run: |
          $sideviewDir = python -c "from pathlib import Path; import sideview; print(Path(sideview.__file__).resolve().parent)"
          $sideviewDll = Join-Path $sideviewDir "sideview_native.dll"
          if (-not (Test-Path -LiteralPath $sideviewDll)) {
            throw "The installed SideView package is missing its Windows native backend: $sideviewDll"
          }

          python -m nuitka `
            --standalone `
            --output-dir="$env:BUILD_DIR" `
            --output-filename="$env:APP_NAME" `
            --windows-icon-from-ico="src\solin\resources\assets\icon.ico" `
            --windows-console-mode=attach `
            --assume-yes-for-downloads `
            --windows-file-version="$env:WINDOWS_VERSION" `
            --windows-product-version="$env:WINDOWS_VERSION" `
            --windows-product-name="$env:PRODUCT_NAME" `
            --windows-company-name="$env:COMPANY_NAME" `
            --windows-file-description="$env:FILE_DESCRIPTION" `
            --copyright="$env:COPYRIGHT" `
            --follow-imports `
            --follow-import-to=solin `
            --follow-import-to=solin.core `
            --follow-import-to=solin.styles `
            --follow-import-to=solin.widgets `
            --nofollow-import-to=PySide6.QtTranslations `
            --include-package=solin `
            --include-package=solin.core `
            --include-package=solin.styles `
            --include-package=solin.widgets `
            --include-package=sideview `
            --include-package=pylibobs `
            --include-module=websocket `
            --include-module=websocket._core `
            --include-module=websocket._app `
            --include-package=ephem `
            --include-package=keyring `
            --include-package=pywinauto `
            --include-package=comtypes `
            --include-package-data=pyqttoast `
            --include-data-dir="src\solin\resources\assets=solin/resources/assets" `
            --include-data-dir="src\solin\resources\remote_control=solin/resources/remote_control" `
            --include-data-dir="src\solin\resources\translations\locales=solin/resources/translations/locales" `
            --include-data-dir="$env:BUILD_DIR\qmlcache\solin\qml\Solin=solin/qml/Solin" `
            --include-data-dir="$env:BUILD_DIR\qmlcache\PySide6\qml=PySide6/qml" `
            --include-data-files="$env:BUILD_DIR\qmlcache\PySide6\qml=PySide6/qml/=**/*.dll" `
            --include-data-files="$env:BUILD_DIR\qmlcache\qt-libs\*.dll=./" `
            --include-data-files="src\solin\resources\translations\*.qm=solin/resources/translations/" `
            --include-data-files="$sideviewDll=sideview/sideview_native.dll" `
            --enable-plugin=pyside6 `
            --include-qt-plugins=platforms,styles,imageformats,position `
            main.py

      - name: Stage and qualify packaged libobs runtime
        shell: pwsh
        run: |
          python scripts\package_libobs_runtime.py `
            --application-dir "$env:BUILD_DIR\main.dist" `
            --executable "$env:BUILD_DIR\main.dist\Solin.exe"
          if ($LASTEXITCODE -ne 0) { throw "Packaged libobs qualification failed." }

      - name: Package native media engine and private runtime
        shell: pwsh
        run: |
          $runtimeRoot = & .\scripts\install_gstreamer_windows.ps1 `
            -InstallType runtime `
            -InstallDirectory build\dependencies\gstreamer-runtime\msvc_x86_64
          if ([string]::IsNullOrWhiteSpace($runtimeRoot)) {
            throw "GStreamer runtime bootstrap did not return an installation root."
          }
          python scripts\package_native_engine_windows.py `
            --gstreamer-root "$runtimeRoot" `
            --application-dir "$env:BUILD_DIR\main.dist"

      - name: Post-build cleanup
        shell: pwsh
        run: |
          $dist = Join-Path $env:BUILD_DIR "main.dist"
          if (-not (Test-Path "$dist\Solin.exe")) {
            throw "Solin.exe was not produced at $dist"
          }
          if (-not (Test-Path "$dist\native\media-engine\solin-media-engine.exe")) {
            throw "The native media engine was not packaged."
          }
          if (-not (Test-Path "$dist\native\media-engine\qt-media-bridge\solin_qt_media_bridge*.pyd")) {
            throw "The Qt media bridge was not packaged."
          }
          if (-not (Test-Path "$dist\native\media-engine\virtual-camera\x64\solin-virtual-camera.dll") -or
              -not (Test-Path "$dist\native\media-engine\virtual-camera\x86\solin-virtual-camera.dll")) {
            throw "The x86/x64 DirectShow virtual-camera filters were not packaged."
          }
          if (-not (Test-Path "$dist\native\media-engine\gstreamer\bin")) {
            throw "The private GStreamer runtime was not packaged."
          }
          if (-not (Test-Path "$dist\native\media-engine\gstreamer\lib\gstreamer-1.0")) {
            throw "The private GStreamer plugins were not packaged."
          }
          if (-not (Test-Path "$dist\sideview\sideview_native.dll")) {
            throw "The SideView Windows backend was not packaged."
          }

          $remove = @(
            "$dist\qtwebengine_devtools_resources.debug.pak"
            "$dist\PIL\_avif.pyd"
          )

          foreach ($path in $remove) {
            if (Test-Path $path) {
              Remove-Item -LiteralPath $path -Force
              Write-Host "Removed $path"
            }
          }

          Get-ChildItem -LiteralPath (Join-Path $dist "solin\qml") -Filter "*.qmlc" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Get-ChildItem -LiteralPath (Join-Path $dist "solin\qml") -Filter "*.qml" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Remove-Item -LiteralPath (Join-Path $dist "solin\qml\qmldir") -Force -ErrorAction SilentlyContinue

          $qmlDir = Join-Path $dist "solin\qml\Solin"
          if (-not (Test-Path (Join-Path $qmlDir "*.qmlc"))) {
            throw "Compiled QML cache files were not packaged in $qmlDir"
          }
          Get-ChildItem -LiteralPath $qmlDir -Filter "*.qml" -File |
            Remove-Item -Force
          if (-not (Test-Path (Join-Path $qmlDir "qmldir"))) {
            throw "Compiled QML qmldir metadata was not packaged in $qmlDir"
          }
          if (Test-Path (Join-Path $qmlDir "*.qml")) {
            throw "Raw QML source files remained in $qmlDir"
          }
          if (-not (Test-Path (Join-Path $dist "PySide6\qml\QtQuick\qmldir"))) {
            throw "QtQuick QML runtime was not packaged."
          }
          if (-not (Test-Path (Join-Path $dist "PySide6\qml\QtQml\qmldir"))) {
            throw "QtQml QML runtime was not packaged."
          }
          if (-not (Test-Path (Join-Path $dist "PySide6\qml\QtQuick\Layouts\qquicklayoutsplugin.dll"))) {
            throw "qquicklayoutsplugin.dll was not packaged."
          }
          if (-not (Test-Path (Join-Path $dist "PySide6\qml\QtQuick\Controls\qtquickcontrols2plugin.dll"))) {
            throw "qtquickcontrols2plugin.dll was not packaged."
          }
          if (-not (Test-Path (Join-Path $dist "PySide6\qml\QtQuick\Controls\impl\qtquickcontrols2implplugin.dll"))) {
            throw "qtquickcontrols2implplugin.dll was not packaged."
          }
          if (-not (Test-Path (Join-Path $dist "PySide6\qml\QtQuick\Controls\Basic\impl\qtquickcontrols2basicstyleimplplugin.dll"))) {
            throw "qtquickcontrols2basicstyleimplplugin.dll was not packaged."
          }
          if (-not (Test-Path (Join-Path $dist "PySide6\qml\QtQuick\Templates\qtquicktemplates2plugin.dll"))) {
            throw "qtquicktemplates2plugin.dll was not packaged."
          }
          if (-not (Test-Path (Join-Path $dist "Qt6QuickLayouts.dll"))) {
            throw "Qt6QuickLayouts.dll was not packaged."
          }
          if (-not (Test-Path (Join-Path $dist "opengl32sw.dll"))) {
            throw "Qt software OpenGL fallback was not packaged."
          }
          if (-not (Test-Path (Join-Path $dist "Qt6QuickControls2.dll"))) {
            throw "Qt6QuickControls2.dll was not packaged."
          }
          if (-not (Test-Path (Join-Path $dist "Qt6QuickControls2Impl.dll"))) {
            throw "Qt6QuickControls2Impl.dll was not packaged."
          }
          if (-not (Test-Path (Join-Path $dist "Qt6QuickControls2BasicStyleImpl.dll"))) {
            throw "Qt6QuickControls2BasicStyleImpl.dll was not packaged."
          }
          if (-not (Test-Path (Join-Path $dist "Qt6QuickTemplates2.dll"))) {
            throw "Qt6QuickTemplates2.dll was not packaged."
          }
          Write-Host "App QML packaged as compiled .qmlc cache only."

      - name: Build full installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe was not found at $iscc"
          }

          Push-Location "packaging\windows\installer"
          try {
            $arguments = @("/DMyAppVersion=$env:APP_VERSION", "/DMyWindowsVersion=$env:WINDOWS_VERSION")
            & $iscc @arguments setup.iss
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          }
          finally {
            Pop-Location
          }

      - name: Build DirectShow rollback-injection installer
        if: ${{ (inputs.release || inputs.run_release_smoke_tests) }}
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $suffix = "-rollback-injection"
          Push-Location "packaging\windows\installer"
          try {
            $arguments = @(
              "/DMyAppVersion=$env:APP_VERSION",
              "/DMyWindowsVersion=$env:WINDOWS_VERSION",
              "/DMyArtifactSuffix=$suffix",
              "/DMyVirtualCameraForceX86RegistrationFailure=1"
            )
            & $iscc @arguments setup.iss
            if ($LASTEXITCODE -ne 0) {
              throw "Rollback-injection installer compilation failed."
            }
          }
          finally {
            Pop-Location
          }
          $rollbackInstaller = Get-Item "build\installer_output\Solin-*-windows-x86_64$suffix.exe"
          $rollbackDirectory = New-Item -ItemType Directory -Force -Path "build\rollback-test"
          $rollbackTarget = Join-Path $rollbackDirectory.FullName $rollbackInstaller.Name
          Move-Item -LiteralPath $rollbackInstaller.FullName -Destination $rollbackTarget -Force
          "SOLIN_ROLLBACK_INSTALLER=$rollbackTarget" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate newly built Windows installer
        if: ${{ (inputs.release || inputs.run_release_smoke_tests) }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "build\installer_output" -Filter "Solin-*-windows-x86_64*.exe" -File)
          if ($installers.Count -ne 1) {
            $found = $installers | ForEach-Object { $_.FullName }
            throw "Expected exactly one newly built installer, found $($installers.Count): $found"
          }
          "SOLIN_NEW_INSTALLER=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SOLIN_NEW_INSTALLER=$($installers[0].FullName)"

      - name: Download verified predecessor
        if: ${{ inputs.release || inputs.run_release_smoke_tests }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOLIN_TRANSITION_WINDOWS_URL: ${{ vars.SOLIN_TRANSITION_WINDOWS_URL }}
          SOLIN_TRANSITION_WINDOWS_SHA256: ${{ vars.SOLIN_TRANSITION_WINDOWS_SHA256 }}
        run: python scripts/release.py download-predecessor --platform windows --architecture x86_64 --output build/previous-installer/Solin.exe --github-env SOLIN_OLD_INSTALLER

      - name: Run full-installer upgrade smoke
        if: ${{ (inputs.release || inputs.run_release_smoke_tests) }}
        shell: pwsh
        env:
          SOLIN_E2E_ALLOW_INSTALLER_MUTATION: "1"
          SOLIN_E2E_STARTUP_SECONDS: "8"
          SOLIN_E2E_INSTALLER_TIMEOUT: "240"
          SOLIN_DIRECTSHOW_HARNESS_X64: 'build\native\media-engine-gstreamer\Release\solin-virtual-camera-filter-tests.exe'
          SOLIN_DIRECTSHOW_HARNESS_X86: 'build\native\directshow-filter-x86\Release\solin-virtual-camera-filter-tests.exe'
        run: |
          python -m pytest tests\e2e\test_installer_upgrade_smoke.py -q

      - name: Run packaged startup smoke
        if: ${{ (inputs.release || inputs.run_release_smoke_tests) }}
        shell: pwsh
        env:
          SOLIN_PACKAGED_EXE: 'build\main.dist\Solin.exe'
          SOLIN_E2E_STARTUP_SECONDS: "8"
        run: |
          python -m pytest tests\e2e\test_packaged_app_smoke.py -q

      - name: Collect installer artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:DIST_DIR | Out-Null
          $installers = @(Get-ChildItem "build/installer_output" -Filter "Solin-*-windows-x86_64*.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one full installer." }
          Copy-Item -LiteralPath $installers[0].FullName -Destination "$env:DIST_DIR/Solin-$env:APP_VERSION-windows-x86_64.exe"

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x86_64
          path: |
            dist/Solin-${{ env.APP_VERSION }}-windows-x86_64.exe
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
