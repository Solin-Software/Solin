name: Generate beta

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solin-beta-preparation
  cancel-in-progress: false

env:
  BETA_RELEASE_ACTORS: ${{ vars.BETA_RELEASE_ACTORS }}
  BETA_RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.12"
      - run: python -m pip install packaging==26.0 requests==2.32.5
      - name: Authorize dispatch
        run: python scripts/prepare_beta.py authorize

  beta:
    needs: authorize
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Store the App key here and restrict this environment to the main branch.
    environment: beta-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.12"
      - run: python -m pip install packaging==26.0 requests==2.32.5
      # A failed-job rerun must authorize its new triggering actor as well.
      - name: Authorize execution
        run: python scripts/prepare_beta.py authorize
      - name: Create repository-scoped App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BETA_RELEASE_APP_ID }}
          private-key: ${{ secrets.BETA_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
          permission-actions: read
          permission-workflows: write
      - name: Prepare, merge, and tag beta
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BETA_RELEASE_BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: python scripts/prepare_beta.py run
