[build-system]
requires = ["setuptools>=80", "PySide6-Essentials==6.11.1"]
build-backend = "setuptools.build_meta"

[project]
name = "solin"
dynamic = ["version"]
description = "Desktop control surface for media, meetings, projection, OBS, and Zoom."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.1",
    "cryptography==48.0.1",
    "ephem==4.2.1",
    "fonttools==4.62.1",
    "keyring==25.7.0",
    "packaging==26.0",
    "pillow==12.1.1",
    "pyserial==3.5",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia==12.2.2; sys_platform == 'darwin'",
    "pylibobs @ https://github.com/AlexsanderMe/pylibobs/releases/download/snapshot-33.0.0-gb15085055394-r1/pylibobs-33.0.0%2Bgb15085055394.r1-py3-none-win_amd64.whl#sha256=3aa5bd098996cdc35938447e7cbc06fad8b890ef78372fa30bdc9fd1ce7a7149 ; sys_platform == 'win32'",
    "pylibobs @ https://github.com/AlexsanderMe/pylibobs/releases/download/snapshot-33.0.0-gb15085055394-r1/pylibobs-33.0.0%2Bgb15085055394.r1-py3-none-manylinux_2_43_x86_64.whl#sha256=4ec6c778302467570d5df1ffbf5db7479d55b6a451f3d9b591fb324b46e03080 ; sys_platform == 'linux'",
    "pylibobs @ https://github.com/AlexsanderMe/pylibobs/releases/download/snapshot-33.0.0-gb15085055394-r1/pylibobs-33.0.0%2Bgb15085055394.r1-py3-none-macosx_13_0_arm64.whl#sha256=37f4a9ee6e6e1498ab127bba46ed3066f44bd625657c48db6d2125a262590ddc ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pylibobs @ https://github.com/AlexsanderMe/pylibobs/releases/download/snapshot-33.0.0-gb15085055394-r1/pylibobs-33.0.0%2Bgb15085055394.r1-py3-none-macosx_13_0_x86_64.whl#sha256=b720fe22c95765616f512bbba91775254ff47b46976d74448d68c248e1c6513a ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "PySide6==6.11.1",
    "pyqt-toast-notification==1.3.3",
    "comtypes==1.4.16; sys_platform == 'win32'",
    "qrcode==8.2",
    "requests==2.32.5",
    "sideview==0.4.1",
    "websocket-client==1.9.0",
]

[project.optional-dependencies]
translation = [
    "google-genai==2.14.0",
]

[project.gui-scripts]
solin = "solin.bootstrap.entrypoint:run"

[project.urls]
Homepage = "https://solinav.vercel.app/"
Repository = "https://github.com/Solin-Software/Solin"
Issues = "https://github.com/Solin-Software/Solin/issues"
Documentation = "https://solinav.vercel.app/guide/"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "solin.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solin = [
    "qml/*.qml",
    "resources/remote_control/*",
    "resources/remote_control/icons/*",
    "resources/remote_control/scripts/*",
    "resources/remote_control/styles/*",
    "resources/assets/*.icns",
    "resources/assets/*.ico",
    "resources/assets/*.png",
    "resources/assets/*.svg",
    "resources/translations/*.qm",
    "resources/translations/locales/*.json",
]

[tool.setuptools.exclude-package-data]
solin = [
    "resources/translations/*.ts",
    "resources/translations/*.qm",
    "resources/translations/.solin-translations*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"
tmp_path_retention_policy = "failed"
markers = [
    "unit: fast tests for pure domain and application services",
    "integration: tests that compose Qt, controllers, filesystem, network, or worker adapters",
    "contract: architecture, persisted-data, packaging, and repository-layout contracts",
    "e2e: packaged application smoke and upgrade-install workflows",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "build",
    "dist",
    "src/solin/resources/translations",
]

[tool.ruff.lint]
# F: Pyflakes correctness, B: bugbear bug-prone patterns,
# S110: no silent try/except/pass blocks, BLE001: no unreviewed broad catches.
select = ["E9", "F", "B", "S110", "BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = [
    "src/solin/bootstrap",
    "src/solin/controllers/scene_runtime_controller.py",
    "src/solin/controllers/content_frame_ingress_controller.py",
    "src/solin/controllers/zoom_meeting_controller.py",
    "src/solin/core/foundation",
    "src/solin/core/integrations/automation/zoom",
    "src/solin/core/jw",
    "src/solin/core/media",
    "src/solin/core/meetings",
    "src/solin/core/onboarding",
    "src/solin/core/playlists",
    "src/solin/core/projection",
    "src/solin/core/profiles",
    "src/solin/core/remote_control",
    "src/solin/core/scenes",
    "src/solin/core/timer",
    "src/solin/core/windowing",
    "src/solin/ui/qml/quick_toolbar.py",
    "src/solin/ui/qml/jwpub_selection.py",
    "src/solin/ui/qml/jwpub_selection_model.py",
    "src/solin/ui/qml/scenes.py",
    "src/solin/ui/qml/scenes_bridge.py",
    "src/solin/ui/qml/scenes_models.py",
    "src/solin/widgets/deferred_scenes_widget.py",
    "src/solin/widgets/zoom_panel.py",
    "src/solin/widgets/scenes",
]
exclude = [
    "**/__pycache__",
    ".pytest-tmp",
    "build",
    "dist",
    "src/solin/resources/translations",
]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportPrivateUsage = false
