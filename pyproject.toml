[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp -p no:cacheprovider"
tmp_path_retention_policy = "failed"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "build",
    "dist",
    "native_webview_widget",
    "translations",
]

[tool.ruff.lint]
# F: Pyflakes correctness, B: bugbear bug-prone patterns,
# S110: no silent try/except/pass blocks, BLE001: no unreviewed broad catches.
select = ["E9", "F", "B", "S110", "BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = [
    "app/core/foundation",
    "app/core/jw",
    "app/core/meetings",
    "app/core/playlists",
    "app/core/timer",
]
exclude = [
    "**/__pycache__",
    ".pytest-tmp",
    "build",
    "dist",
    "native_webview_widget",
    "translations",
]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportPrivateUsage = false
