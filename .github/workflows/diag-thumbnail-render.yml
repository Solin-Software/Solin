name: Diagnose thumbnail render contention

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: cocoa
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install native and Python dependencies
        run: |
          python -m pip install setuptools==80.10.2 wheel==0.46.3 cffi==2.0.0
          python scripts/build_pylibobs_macos.py --output-dir .pip-wheels
          python -m pip install --no-index --find-links .pip-wheels --no-deps pylibobs
          python -m pip install -r requirements-dev.txt -e .
      - name: Qualify native thumbnail and content pipeline
        run: |
          python -m pytest tests/integration/test_native_scene_content_pipeline.py -k 'closing_image or video_auto_switch' --log-cli-level=WARNING --durations=20
