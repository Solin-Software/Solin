name: Bug report
description: Report unexpected behavior or a crash in Solin.
body:
  - type: markdown
    attributes:
      value: |
        Describe one problem per report. Check [existing issues](https://github.com/Solin-Software/Solin/issues?q=is%3Aissue) for related reports before submitting.

        Issues and attachments are public. Remove passwords, tokens, personal information, and private media from anything you share.
  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened?
      description: Describe the problem and include any error message.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      description: Describe the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and frequency
      description: Describe how to trigger the problem. If it is intermittent or you cannot reproduce it reliably, describe what you were doing and how often it occurs.
      placeholder: |
        1. Open...
        2. Select...
        3. The problem occurs when...
    validations:
      required: true
  - type: input
    id: solin-version
    attributes:
      label: Solin version
      description: Give the exact version. If Solin will not open, use the downloaded release filename. For a source build, include the commit if known.
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system and version
      description: Include the Windows or macOS version, or the Linux distribution and version. Add the processor architecture if known.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Relevant setup
      description: If relevant, describe connected equipment, integrations, or media formats involved. For remote-control problems, include the other device's operating system and browser version.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs, screenshots, or other details
      description: Optionally paste relevant log excerpts or attach files and screenshots here. Share only material needed to understand the problem, with private information removed.
    validations:
      required: false
