<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S3 remote commenter</title>
<style>body { background: #111; color: #aaa; font: 13px ui-monospace, monospace; white-space: pre; padding: 8px; }</style>
</head>
<body>
<div id="log">starting…</div>
<script src="vendor/livekit-client.umd.js"></script>
<script>
// Remote commenter: publishes a synthetic 1 kHz beep every 2.5 s as its "microphone"
// and detects the beep coming back in the hall program audio.
// Usage: s3.html?room=s3&label=aec-off
const LK = LivekitClient;
const p = new URLSearchParams(location.search);
const ROOM = p.get('room') || 's3', LABEL = p.get('label') || '';
const logEl = document.getElementById('log');
const epoch = perf => performance.timeOrigin + perf;   // same clock as the hall's time.time()
const sent = [];       // {k, epoch_ms}
let k = 0;

const post = rec => fetch('/log', { method: 'POST', body: JSON.stringify({ test: 's3', label: LABEL, ...rec }) }).catch(() => {});

(async () => {
  const ctx = new AudioContext({ latencyHint: 'interactive' });
  await ctx.resume();
  const dest = ctx.createMediaStreamDestination();
  const micTrack = dest.stream.getAudioTracks()[0];

  const room = new LK.Room({ adaptiveStream: false, dynacast: false });
  room.on(LK.RoomEvent.TrackSubscribed, track => {
    if (track.kind !== 'audio') return;
    const el = track.attach(); el.muted = true; document.body.appendChild(el);
    const src = ctx.createMediaStreamSource(new MediaStream([track.mediaStreamTrack]));
    const band = ctx.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 1000; band.Q.value = 8;
    const an = ctx.createAnalyser(); an.fftSize = 512;
    src.connect(band).connect(an);
    const buf = new Float32Array(an.fftSize);
    let floor = 0.001, last = 0, peak = 0, peakUntil = 0, pendingK = null;
    setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let s = 0; for (const x of buf) s += x * x;
      const rms = Math.sqrt(s / buf.length), t = performance.now();
      if (pendingK !== null) { peak = Math.max(peak, rms); if (t > peakUntil) { post({ event: 'return_peak', k: pendingK, rms: +peak.toFixed(4), floor: +floor.toFixed(5) }); pendingK = null; } }
      const thr = Math.max(floor * 6, 0.004);
      if (rms > thr && t - last > 1500) {
        last = t;
        const s0 = [...sent].reverse().find(x => epoch(t) - x.epoch_ms < 2000 && epoch(t) > x.epoch_ms);
        if (s0) { post({ event: 'returned', k: s0.k, epoch_ms: epoch(t), rtt_ms: Math.round(epoch(t) - s0.epoch_ms) }); pendingK = s0.k; peak = rms; peakUntil = t + 300; }
      } else if (rms < thr) floor = floor * 0.99 + rms * 0.01;
    }, 5);
  });

  const { token, url } = await (await fetch(`/token?identity=remote-${Date.now()}&room=${ROOM}&publish=1`)).json();
  await room.connect(url, token);
  await room.localParticipant.publishTrack(micTrack, { source: LK.Track.Source.Microphone, dtx: false, red: false });

  setInterval(() => {
    const t = ctx.currentTime + 0.05;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.frequency.value = 1000; g.gain.value = 0.5;
    osc.connect(g).connect(dest);
    osc.start(t); osc.stop(t + 0.15);
    // Map the scheduled context time to wall time via the render clock (not the output clock:
    // the beep goes into a MediaStreamDestination, not to the speakers).
    const rec = { k: k++, epoch_ms: epoch(performance.now() + (t - ctx.currentTime) * 1000) };
    sent.push(rec); post({ event: 'sent', ...rec });
    logEl.textContent = `S3 ${LABEL} room=${ROOM} sent=${k}`;
  }, 2500);
})().catch(e => { logEl.textContent = 'error ' + e; post({ event: 'error', error: String(e) }); });
</script>
</body>
</html>
