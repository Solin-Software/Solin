name: Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13.12"
  QT_QPA_PLATFORM: xcb
  QT_QUICK_BACKEND: software

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect quality-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_quality=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          mapfile -t changed_files < <(git diff --name-only "$base" "$head")

          run_quality=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              *.md|docs/*|src/solin/resources/translations/locales/*.json|src/solin/resources/translations/*.ts|src/solin/resources/translations/*.qm)
                ;;
              *)
                run_quality=true
                break
                ;;
            esac
          done

          echo "run_quality=$run_quality" >> "$GITHUB_OUTPUT"

      - name: Validate locales
        run: python3 scripts/check_locales.py

      - name: Install Qt and SideView build dependencies
        if: ${{ steps.filter.outputs.run_quality == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            libegl1 \
            libgl1 \
            libgtk-3-dev \
            libopengl0 \
            libpulse0 \
            libwebkit2gtk-4.1-dev \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            pkg-config \
            xauth \
            xvfb

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: ${{ steps.filter.outputs.run_quality == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        if: ${{ steps.filter.outputs.run_quality == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        if: ${{ steps.filter.outputs.run_quality == 'true' }}
        run: uv pip install --system -r requirements-dev.txt -e .

      - name: Ruff lint
        if: ${{ steps.filter.outputs.run_quality == 'true' }}
        run: python -m ruff check .

      - name: Pyright typecheck
        if: ${{ steps.filter.outputs.run_quality == 'true' }}
        run: python scripts/typecheck.py

      - name: Pytest
        if: ${{ steps.filter.outputs.run_quality == 'true' }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -m pytest
